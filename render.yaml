services:
  - type: web
    name: mlg-bot-runtime
    runtime: node
    repo: https://github.com/dgz001/bot-mlg
    branch: main
    plan: free
    region: virginia
    buildCommand: npm ci --include=dev --ignore-scripts && npm test && npm run typecheck
    startCommand: node scripts/migrate.ts && node src/worker.ts
    healthCheckPath: /livez
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: APP_DATABASE_PASSWORD
        generateValue: true
      - key: AUTH_ENCRYPTION_KEY
        generateValue: true
      - key: CONTROL_PASSWORD
        generateValue: true
      - key: CONTROL_ORIGIN
        value: https://mlg-bot-runtime.onrender.com
