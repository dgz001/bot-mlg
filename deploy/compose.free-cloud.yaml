# Execute from repository root: docker compose --env-file .env.runtime -f deploy/compose.free-cloud.yaml up -d --build
services:
  bot:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file: ../.env.runtime
    environment:
      BOT_MODE: resenha
      NODE_ENV: production
      PORT: "3000"
      FINANCE_ENABLED: "false"
    restart: unless-stopped
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/livez').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  panel:
    image: caddy:2
    restart: unless-stopped
    environment:
      PANEL_HOST: ${PANEL_HOST:?Configure PANEL_HOST in .env.runtime}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.free-cloud:/etc/caddy/Caddyfile:ro
      - panel_tls:/data
      - panel_config:/config
    depends_on:
      bot:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  panel_tls:
  panel_config:
